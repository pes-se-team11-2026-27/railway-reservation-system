services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rrs
    ports:
      - "5432:5432"
    volumes:
      - rrs-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rrs"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/rrs
      PORT: 3000
      NODE_ENV: development
      TLS_ENABLED: "true"
      HTTPS_PORT: 3443
    ports:
      - "3000:3000"
      - "3443:3443"
    depends_on:
      db:
        condition: service_healthy

volumes:
  rrs-data:
